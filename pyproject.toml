[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cadflow-lite"
version = "0.3.74"
description = "Lightweight LSF and EDA license observability portal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
sqlite-fallback = [
  "pysqlite3-binary>=0.5,<1",
]

[tool.setuptools]
packages = ["app", "app.collectors"]
include-package-data = true

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
